{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Delivery &amp; Pick-up</h2>
<div class="panel">
  <div class="chips" id="chips">{% for s in ['Pending','Completed','Cancelled','All'] %}<button class="chip {{ 'on' if s=='Pending' }}" data-s="{{ s }}">{{ s }}</button>{% endfor %}</div>
  <div class="row"><div><label>Search customer or order number</label><input id="q"></div></div>
  <div id="list"></div>
</div>
{% endblock %}
{% block scripts %}<script>
let status = 'Pending', rows = [];
async function load() {
  rows = await api('/api/orders?' + new URLSearchParams({ status: status === 'All' ? '' : status, q: $('#q').value }));
  $('#list').innerHTML = table([
    { h: 'Order', f: r => '#' + r.id }, { h: 'Customer', f: r => `<b>${esc(r.customer)}</b> ${badge(r.customer_type)}` },
    { h: 'Items', f: r => esc(r.items) }, { h: 'Total', num: 1, f: r => peso(r.total) },
    { h: 'Type', f: r => r.fulfillment }, { h: 'Delivery address', f: r => esc(r.address || '') },
    { h: 'Status', f: r => badge(r.status) },
    { h: '', f: r => `<button class="btn sm alt" data-v="${r.id}">Details</button>` + (r.status === 'Pending' ? ` <button class="btn sm" data-c="${r.id}">Change</button> <button class="btn sm go" data-ok="${r.id}">Complete</button> <button class="btn sm bad" data-x="${r.id}">Cancel</button>` : '') }], rows, 'No orders in this view.');
}
async function act(url, msg, method = 'POST') { try { await api(url, { method }); toast(msg); load(); } catch (e) { toast(e.message, true); } }
$('#chips').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; status = c.dataset.s; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); load(); };
$('#q').oninput = debounce(load);
$('#list').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset, o = rows.find(r => r.id == (d.v || d.c || d.ok || d.x));
  if (d.ok) return act(`/api/orders/${o.id}/complete`, `Order #${o.id} completed.`);
  if (d.x) { if (confirm(`Cancel order #${o.id}? Stock will be put back.`)) act(`/api/orders/${o.id}/cancel`, `Order #${o.id} cancelled.`); return; }
  if (d.v) {
    const m = modal(`<h3>Order #${o.id}</h3><p><b>${esc(o.customer)}</b> ${badge(o.customer_type)}<br>${esc(o.phone || '')}<br>${esc(o.customer_address || '')}</p>
      <p>${esc(o.items)}</p><p>Subtotal ${peso(o.subtotal)}<br>Discount −${peso(o.discount)}<br><b>Total ${peso(o.total)}</b></p>
      <p>${o.fulfillment}${o.address ? ': ' + esc(o.address) : ''} ${badge(o.status)}<br><small>Placed ${dt(o.created_at)}</small></p>
      <div class="actions"><button class="btn ghost" id="mx">Close</button></div>`);
    return ($('#mx', m).onclick = m.close);
  }
  const m = modal(`<h3>Change order #${o.id}</h3>
    <div class="f"><label>Pick-up or delivery</label><select id="mf"><option>Pick-up</option><option>Delivery</option></select></div>
    <div class="f" id="mab"><label>Delivery address</label><input id="ma" value="${esc(o.address || o.customer_address || '')}"></div>
    <div class="actions"><button class="btn ghost" id="mx">Cancel</button><button class="btn go" id="mo">Save changes</button></div>`);
  const sync = () => { $('#mab', m).hidden = $('#mf', m).value !== 'Delivery'; };
  $('#mf', m).value = o.fulfillment; sync(); $('#mf', m).onchange = sync; $('#mx', m).onclick = m.close;
  $('#mo', m).onclick = async () => {
    try { await api('/api/orders/' + o.id, { method: 'PUT', body: { fulfillment: $('#mf', m).value, address: $('#ma', m).value } }); m.close(); toast('Order updated.'); load(); }
    catch (x) { toast(x.message, true); }
  };
};
load();
</script>{% endblock %}
